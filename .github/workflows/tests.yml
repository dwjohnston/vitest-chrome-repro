name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Run tests
    strategy:
      matrix:
        path: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: install dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      - name: run tests
        run: |
          npm run test
